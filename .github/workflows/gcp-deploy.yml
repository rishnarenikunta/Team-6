name: Deploy to Google Cloud

# This section restricts the workflow to only run on specific branches
on:
  push:
    branches:
      - 'cloud/*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # These permissions are required for Workload Identity Federation to work
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        # You will get these values after setting up Step 1
        workload_identity_provider: 'projects/528253522819/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
        service_account: 'github-actions-sa@youtravel-487521.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy Cloud Run Worker Job
      run: |
        gcloud run jobs deploy youtravel-llm-job \
          --source . \
          --region us-central1 \
          --quiet \
          --command python \
          --args DataCollectionTasks/monoprompt.py

    - name: Update Cloud Run Dispatcher Job Image
      run: |
        # 1. Search the raw job config for the exact Artifact Registry URL
        IMAGE_URL=$(gcloud run jobs describe youtravel-llm-job --region us-central1 --format=yaml | grep -o "us-central1-docker.pkg.dev/youtravel-487521/[^ '\"]*" | head -n 1)
        
        # 2. Safety check: ensure we actually found the URL
        if [ -z "$IMAGE_URL" ]; then
          echo "Error: Could not find the image URL in the job description."
          exit 1
        fi
        
        echo "Found newest image: $IMAGE_URL"
        
        # 3. Update the dispatcher job
        gcloud run jobs update youtravel-batch-dispatcher \
          --image "$IMAGE_URL" \
          --region us-central1